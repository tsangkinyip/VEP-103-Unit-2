<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2</title>
<!-- Tailwind for Styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
.animate-in { animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.mic-active {
animation: pulse-red 1.2s infinite;
color: white !important;
background-color: #ef4444 !important;
border-color: #dc2626 !important;
}

@keyframes pulse-red {
0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 md:p-8">

<div class="max-w-5xl mx-auto">
<!-- Header -->
<header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
<div class="flex items-center gap-4">
<div class="p-3 bg-indigo-600 rounded-2xl text-white shadow-lg shadow-indigo-100">
<i class="fa-solid fa-languages text-2xl"></i>
</div>
<div>
<h1 class="text-4xl font-black italic tracking-tighter leading-none uppercase">Unit 2</h1>
<p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-1">VEP - Listening and Speaking (LS103)</p>
</div>
</div>

<nav class="flex bg-white p-1 rounded-2xl shadow-sm border border-slate-200">
<button onclick="switchTab('bank')" id="tab-bank" class="flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all bg-indigo-600 text-white shadow-md">
<i class="fa-solid fa-book-open text-xs"></i> Language Bank
</button>
<button onclick="switchTab('practice')" id="tab-practice" class="flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-slate-600">
<i class="fa-solid fa-comment-dots text-xs"></i> Conversation Practice
</button>
</nav>
</header>

<!-- Main Content Area -->
<main id="view-container" class="animate-in">
<!-- Content Injected via JavaScript -->
</main>
</div>

<script>
// --- DATA ---
const DATA = {
bank: [
{
category: "L1: Greeting Guests",
subsections: [
{ title: "Welcoming", items: ["Welcome to Lux Hotel.", "Welcome. This is the lobby.", "Good morning.", "Hello.", "How are you?"] },
{ title: "Responding to greetings", items: ["Great, thanks. How about you?", "Great, too. Thank you.", "I'm fine too, thank you.", "I'm fine, thank you. And you?"] }
]
},
{
category: "L2: Saying Goodbye",
subsections: [
{ title: "Farewells", items: ["Goodbye!", "Enjoy yourself.", "Have a good flight!", "Have a nice day!", "Have fun.", "See you later!"] }
]
},
{
category: "L3: Introductions",
subsections: [
{ title: "Self-Introduction", items: ["Good afternoon. I'm Jack. How may I help you?", "I'm Steve, Steve Brown.", "My name's Steve Brown.", "This is Steve Brown. He can help you."] }
]
},
{
category: "L4: Thanking & Responding",
subsections: [
{ title: "Thanking", items: ["Thank you very much.", "Thank you.", "Thanks.", "Thank you for your help.", "I really appreciate it."] },
{ title: "Responding to thanking", items: ["It's my pleasure.", "My pleasure.", "I'm happy to help.", "No problem.", "Not at all.", "You're welcome.", "Don't mention it."] }
]
}
],
conversation: [
{ speaker: "Jack", text: "Good afternoon. I'm Jack. How may I help you?" },
{ speaker: "Ms Parker", text: "Good afternoon. I'd like a luggage parking ticket please." },
{ speaker: "Jack", text: "Of course. May I have your guest pass?" },
{ speaker: "Ms Parker", text: "Yes." },
{ speaker: "Jack", text: "Thank you Ms. Parker. Here's your ticket." },
{ speaker: "Ms Parker", text: "Thank you." },
{ speaker: "Jack", text: "You're welcome. By the way, it's raining outside. Do you have an umbrella?" },
{ speaker: "Ms Parker", text: "Oh no. I don't!" },
{ speaker: "Jack", text: "Don't worry. Here you are." },
{ speaker: "Ms Parker", text: "Oh thank you SO much!" },
{ speaker: "Jack", text: "Don't mention it." }
]
};

// --- STATE ---
let currentTab = 'bank';
let scores = {};
let lastTranscripts = {};
let isRecordingId = null;
let isPlayingId = null;
let finalTranscriptBuffer = "";

const synth = window.speechSynthesis;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SpeechRecognition) {
recognition = new SpeechRecognition();
recognition.continuous = true;
recognition.interimResults = true;
recognition.lang = 'en-US';

recognition.onresult = (event) => {
let currentSessionText = "";
for (let i = event.resultIndex; i < event.results.length; ++i) {
if (event.results[i].isFinal) {
finalTranscriptBuffer += event.results[i][0].transcript + " ";
}
// For UI feedback, combine buffer and interim
currentSessionText = finalTranscriptBuffer + (event.results[i].isFinal ? "" : event.results[i][0].transcript);
}

// Live tracking for accuracy display
if (isRecordingId) {
lastTranscripts[isRecordingId] = currentSessionText.trim();
render();
}
};

recognition.onend = () => {
if (isRecordingId) {
processResult();
isRecordingId = null;
render();
}
};

recognition.onerror = (event) => {
console.error("Recognition Error:", event.error);
isRecordingId = null;
render();
};
}

function processResult() {
if (!isRecordingId) return;
const targetText = recognition.targetText;
const capturedText = lastTranscripts[isRecordingId] || "";
const score = calculateScore(targetText, capturedText);
scores[isRecordingId] = score;
}

// --- IMPROVED SCORING LOGIC ---
function calculateScore(target, input) {
const clean = (s) => s.toLowerCase().replace(/[^\w\s]/g, "").trim();
const tWords = clean(target).split(/\s+/).filter(w => w.length > 0);
const iWords = clean(input).split(/\s+/).filter(w => w.length > 0);

if (tWords.length === 0) return 0;
if (iWords.length === 0) return 0;

let matches = 0;
tWords.forEach(tWord => {
// Check if target word exists in input (simple fuzzy match)
if (iWords.some(iWord => iWord === tWord || iWord.includes(tWord))) {
matches++;
}
});

return Math.round((matches / tWords.length) * 100);
}

function switchTab(tab) {
currentTab = tab;
render();
}

function playText(text, speaker, id) {
if (synth.speaking) synth.cancel();
const utter = new SpeechSynthesisUtterance(text);
utter.pitch = (speaker === "Ms Parker") ? 1.3 : 1.0;
utter.onstart = () => { isPlayingId = id; render(); };
utter.onend = () => { isPlayingId = null; render(); };
synth.speak(utter);
}

async function toggleMic(id, text) {
if (isRecordingId === id) {
recognition.stop();
return;
}

if (isRecordingId !== null) {
recognition.stop();
}

try {
await navigator.mediaDevices.getUserMedia({ audio: true });
finalTranscriptBuffer = "";
lastTranscripts[id] = "";
isRecordingId = id;
recognition.targetText = text;
recognition.start();
render();
} catch (e) {
alert("Microphone access denied. Please check your browser permissions.");
}
}

function render() {
const container = document.getElementById('view-container');
const bankBtn = document.getElementById('tab-bank');
const pracBtn = document.getElementById('tab-practice');

if (currentTab === 'bank') {
bankBtn.className = "flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all bg-indigo-600 text-white shadow-md";
pracBtn.className = "flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-slate-600";
} else {
pracBtn.className = "flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all bg-indigo-600 text-white shadow-md";
bankBtn.className = "flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-slate-600";
}

if (currentTab === 'bank') {
container.innerHTML = `
<div class="grid md:grid-cols-2 gap-6 pb-12">
${DATA.bank.map((cat, cIdx) => `
<div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
<div class="bg-slate-50 p-4 border-b border-slate-100 flex items-center gap-2">
<i class="fa-solid fa-star text-amber-500 text-xs"></i>
<h3 class="font-black text-indigo-600 text-[10px] uppercase tracking-widest">${cat.category}</h3>
</div>
<div class="p-4 space-y-6">
${cat.subsections.map((sub, sIdx) => `
<div>
<h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 px-2 tracking-[0.1em] border-l-2 border-indigo-200 ml-1">${sub.title}</h4>
<div class="space-y-1">
${sub.items.map((item, iIdx) => {
const id = `bank-${cIdx}-${sIdx}-${iIdx}`;
const score = scores[id];
const transcript = lastTranscripts[id];
const isRec = isRecordingId === id;
return `
<div class="p-3 rounded-2xl transition-all border ${score !== undefined ? 'bg-indigo-50/30 border-indigo-100' : 'hover:bg-slate-50 border-transparent'}">
<div class="flex items-center justify-between">
<span class="text-sm font-bold text-slate-700">${item}</span>
<div class="flex items-center gap-1 shrink-0 ml-4">
<button onclick="playText('${item.replace(/'/g, "\\'")}', 'Jack', '${id}')" class="p-2 rounded-xl transition-all ${isPlayingId === id ? 'text-indigo-600 bg-indigo-100' : 'text-slate-300 hover:text-indigo-600'}">
<i class="fa-solid fa-volume-high ${isPlayingId === id ? 'fa-beat' : ''}"></i>
</button>
<button onclick="toggleMic('${id}', '${item.replace(/'/g, "\\'")}')" class="flex items-center gap-2 px-3 py-2 rounded-xl transition-all text-xs font-black ${isRec ? 'mic-active' : 'text-slate-300 bg-slate-50 hover:text-red-500'}">
<i class="fa-solid fa-microphone"></i>
${isRec ? 'SUBMIT' : ''}
</button>
</div>
</div>
${(isRec && transcript) || score !== undefined ? `
<div class="mt-3 bg-white/50 p-2 rounded-lg border border-slate-100 animate-in">
<p class="text-[9px] font-black text-slate-400 uppercase mb-1">What the engine heard:</p>
<p class="text-xs italic text-slate-600">"${transcript || '...'}"</p>
${score !== undefined ? `
<div class="mt-2 flex items-center gap-3">
<div class="flex-1 h-1.5 bg-slate-200 rounded-full overflow-hidden">
<div class="h-full bg-indigo-500" style="width: ${score}%"></div>
</div>
<span class="text-[10px] font-black text-indigo-600">${score}% Accuracy</span>
</div>
` : ''}
</div>
` : ''}
</div>
`;
}).join('')}
</div>
</div>
`).join('')}
</div>
</div>
`).join('')}
</div>
`;
} else {
container.innerHTML = `
<div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden mb-12">
<div class="p-6 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
<h2 class="text-xl font-black text-slate-800 italic">Conversation Practice</h2>
<span class="text-[9px] font-black text-slate-500 bg-white px-3 py-1.5 rounded-full border border-slate-200 shadow-sm uppercase tracking-widest">
<i class="fa-solid fa-check-double text-indigo-500 mr-2"></i> Buffer Accumulation Enabled
</span>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-slate-50/50">
<th class="px-6 py-4 text-[9px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">Speaker</th>
<th class="px-6 py-4 text-[9px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">Phrase</th>
<th class="px-6 py-4 text-[9px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 text-center">Action</th>
<th class="px-6 py-4 text-[9px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100 text-right">Results</th>
</tr>
</thead>
<tbody>
${DATA.conversation.map((line, idx) => {
const id = `prac-${idx}`;
const score = scores[id];
const transcript = lastTranscripts[id];
const isRec = isRecordingId === id;
return `
<tr class="group border-b border-slate-50 hover:bg-slate-50/50 transition-all">
<td class="px-6 py-4 whitespace-nowrap">
<span class="text-[9px] font-black px-2 py-1 rounded-md ${line.speaker === 'Jack' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-200 text-slate-700'} uppercase">
${line.speaker}
</span>
</td>
<td class="px-6 py-4">
<p class="text-sm font-bold text-slate-700 italic">"${line.text}"</p>
${isRec || score !== undefined ? `
<div class="mt-2 p-2 bg-indigo-50/50 rounded-lg border border-indigo-100 animate-in">
<p class="text-[8px] font-black text-indigo-400 uppercase tracking-tighter">Recognized Text:</p>
<p class="text-xs italic text-slate-500 font-medium">"${transcript || 'Listening...'}"</p>
</div>
` : ''}
</td>
<td class="px-6 py-4">
<div class="flex items-center justify-center gap-3">
<button onclick="playText('${line.text.replace(/'/g, "\\'")}', '${line.speaker}', '${id}')"
class="p-3 rounded-xl bg-white border border-slate-200 shadow-sm transition-all ${isPlayingId === id ? 'text-indigo-600 ring-2 ring-indigo-100' : 'text-slate-400 hover:text-indigo-600'}">
<i class="fa-solid fa-volume-high"></i>
</button>
<button onclick="toggleMic('${id}', '${line.text.replace(/'/g, "\\'")}')"
class="flex items-center gap-2 px-4 py-3 rounded-xl border transition-all text-[10px] font-black ${isRec ? 'mic-active' : 'bg-white border-slate-200 text-slate-400 hover:text-red-600'}">
<i class="fa-solid fa-microphone"></i>
${isRec ? 'SUBMIT' : ''}
</button>
</div>
</td>
<td class="px-6 py-4 text-right">
${score !== undefined ? `
<div class="flex flex-col items-end gap-1.5 animate-in">
<span class="text-xs font-black text-indigo-600">${score}%</span>
<div class="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
<div class="h-full bg-indigo-500" style="width: ${score}%"></div>
</div>
</div>
` : `
<span class="text-[10px] font-bold text-slate-300 italic uppercase tracking-tighter">Click Mic to Start</span>
`}
</td>
</tr>
`;
}).join('')}
</tbody>
</table>
</div>
</div>
`;
}
}

render();
</script>
</body>
</html>
