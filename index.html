<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEP 103 Language Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
.fade-in { animation: fadeIn 0.3s ease-out forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.tab-active { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }

/* Audio & Mic States */
.audio-loading { opacity: 0.5; pointer-events: none; cursor: wait; }
.audio-playing { color: #4f46e5 !important; animation: bounce 0.5s infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-3px); } }
.mic-active { background-color: #ef4444 !important; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

/* Practice Chat Styling */
.practice-row { transition: all 0.3s ease; border-radius: 1.5rem; }
.row-active { transform: scale(1.02); z-index: 10; ring: 2px solid #4f46e5; }
.row-inactive { opacity: 0.4; filter: grayscale(50%); }

#audio-unlock-overlay { backdrop-filter: blur(8px); }
#practice-table { scroll-behavior: smooth; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 overflow-x-hidden">

<!-- Interaction Shield -->
<div id="audio-unlock-overlay" class="fixed inset-0 z-[100] bg-slate-900/60 flex items-center justify-center p-6 transition-opacity duration-500">
<div class="bg-white rounded-[2rem] p-10 max-w-sm w-full text-center shadow-2xl">
<div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
<i data-lucide="headphones" class="w-10 h-10 text-indigo-600"></i>
</div>
<h2 class="text-2xl font-black mb-2 text-slate-800">Ready to start?</h2>
<p class="text-slate-500 text-sm mb-8">Tap to enable audio and microphone for your practice session.</p>
<button onclick="initApp()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-200 active:scale-95 transition-transform uppercase tracking-widest">Enable All Features</button>
</div>
</div>

<div id="app" class="max-w-5xl mx-auto p-4 md:p-8 opacity-20 transition-opacity duration-1000">
<header class="flex flex-col md:flex-row justify-between items-center py-6 mb-8 gap-6 border-b border-slate-200/60">
<div class="flex items-center gap-4">
<div class="p-3 bg-indigo-600 rounded-2xl text-white shadow-xl shadow-indigo-100">
<i data-lucide="languages" class="w-8 h-8"></i>
</div>
<div>
<h1 class="text-4xl font-black italic tracking-tighter leading-none text-slate-800">VEP 103</h1>
<p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1.5">Vocational English Portal</p>
</div>
</div>
<div class="flex bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
<button type="button" onclick="switchTab('bank')" id="tab-bank" class="px-6 md:px-8 py-2.5 rounded-xl text-sm font-bold transition-all tab-active uppercase">Language Bank</button>
<button type="button" onclick="switchTab('practice')" id="tab-practice" class="px-6 md:px-8 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-slate-600 uppercase">Practice</button>
</div>
</header>

<!-- LANGUAGE BANK VIEW -->
<main id="view-bank" class="grid md:grid-cols-2 gap-6 pb-20 fade-in">
<!-- Populated by JS -->
</main>

<!-- PRACTICE VIEW -->
<main id="view-practice" class="hidden max-w-4xl mx-auto pb-20 fade-in relative">
<div class="bg-white rounded-[2.5rem] shadow-2xl border border-white flex flex-col overflow-hidden h-[75vh]">

<!-- TOP FIXED CONTROLS -->
<div id="active-controls" class="p-6 bg-slate-50 border-b border-slate-100 flex flex-col items-center gap-4 shrink-0">
<div class="flex items-center gap-6 md:gap-12">
<button id="btn-listen" onclick="playCurrentLine()" class="w-12 h-12 rounded-full bg-white shadow-md flex items-center justify-center text-slate-400 hover:text-indigo-600 border border-slate-100 transition-all active:scale-90">
<i data-lucide="volume-2" class="w-6 h-6"></i>
</button>

<button id="btn-mic" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-indigo-600 shadow-xl shadow-indigo-200 flex items-center justify-center text-white transition-all hover:scale-105 active:scale-95">
<i data-lucide="mic" class="w-10 h-10"></i>
</button>

<button id="btn-next" onclick="nextStep()" class="w-12 h-12 rounded-full bg-white shadow-md flex items-center justify-center text-slate-400 hover:text-indigo-600 border border-slate-100 transition-all active:scale-90">
<i data-lucide="chevron-right" class="w-6 h-6"></i>
</button>
</div>

<div id="feedback-display" class="hidden w-full max-w-sm text-center">
<div class="flex items-center justify-center gap-3">
<span id="accuracy-text" class="text-lg font-black text-indigo-600">0%</span>
<div class="w-32 h-1.5 bg-indigo-100 rounded-full overflow-hidden">
<div id="accuracy-bar" class="h-full bg-indigo-600 transition-all duration-700" style="width: 0%"></div>
</div>
</div>
<p id="transcript-text" class="text-xs italic text-slate-500 mt-1 truncate"></p>
</div>

<div class="flex w-full justify-between items-center px-4">
<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Active Line Highlighted Below</p>
<button onclick="resetPractice()" class="text-[9px] font-black text-slate-400 hover:text-indigo-600 uppercase flex items-center gap-1">
<i data-lucide="refresh-cw" class="w-2 h-2"></i> Reset
</button>
</div>
</div>

<!-- SCROLLABLE DIALOGUE TABLE -->
<div id="practice-table" class="flex-1 overflow-y-auto p-6 space-y-6 bg-white">
<!-- Dialogue rows injected here -->
</div>
</div>
</main>
</div>

<div id="status-msg" class="hidden fixed top-4 right-4 z-50 p-4 bg-white border border-slate-200 rounded-2xl shadow-xl fade-in flex items-center gap-3 text-sm font-medium text-slate-600">
<i data-lucide="info" class="w-5 h-5 text-indigo-500"></i>
<span id="status-text">Status message</span>
</div>

<script>
const apiKey = "";
const TTS_MODEL = "gemini-2.5-flash-preview-tts";

let audioCtx = null;
let isSpeaking = false;
let recognition = null;
let isRecording = false;
let currentStep = 0;

const LANGUAGE_BANK_DATA = [
{
category: "L1: Greeting Guests",
subsections: [
{ title: "Welcoming", items: ["Welcome to Lux Hotel.", "Welcome. This is the lobby.", "Good morning.", "Hello.", "How are you?"] },
{ title: "Responding", items: ["Great, thanks. How about you?", "Great, too. Thank you.", "I'm fine too, thank you.", "I'm fine, thank you. And you?"] }
]
},
{
category: "L2: Saying Goodbye",
subsections: [
{ title: "Farewells", items: ["Goodbye!", "Enjoy yourself.", "Have a good flight!", "Have a nice day!", "Have fun.", "See you later!"] }
]
},
{
category: "L3: Introductions",
subsections: [
{ title: "Self-Intro", items: ["Good afternoon. I'm Jack. How may I help you?", "I'm Steve, Steve Brown.", "My name's Steve Brown.", "This is Steve Brown. He can help you."] }
]
},
{
category: "L4: Thanking & Responding",
subsections: [
{ title: "Thanking", items: ["Thank you (very much).", "Thanks."] },
{ title: "Respond to thanking", items: ["(It's) My pleasure.", "I'm happy to help.", "No problem.", "Not at all.", "You're welcome."] }
]
}
];

const CONVERSATION = [
{ speaker: "Jack", text: "Good afternoon. I'm Jack. How may I help you?" },
{ speaker: "Ms Parker", text: "Good afternoon. I'd like a luggage parking ticket please." },
{ speaker: "Jack", text: "Of course. May I have your guest pass?" },
{ speaker: "Ms Parker", text: "Yes." },
{ speaker: "Jack", text: "Thank you Ms. Parker. Here's your ticket." },
{ speaker: "Ms Parker", text: "Thank you." },
{ speaker: "Jack", text: "You're welcome. By the way, it's raining outside. Do you have an umbrella?" },
{ speaker: "Ms Parker", text: "Oh no. I don't!" },
{ speaker: "Jack", text: "Don't worry. Here you are." },
{ speaker: "Ms Parker", text: "Oh thank you SO much!" },
{ speaker: "Jack", text: "Don't mention it." }
];

function showStatus(text, duration = 3000) {
const el = document.getElementById('status-msg');
document.getElementById('status-text').innerText = text;
el.classList.remove('hidden');
setTimeout(() => el.classList.add('hidden'), duration);
}

async function initApp() {
try {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
if (audioCtx.state === 'suspended') await audioCtx.resume();
} catch (e) { console.error(e); }

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
recognition = new SpeechRecognition();
recognition.lang = 'en-US';
recognition.onresult = (event) => displayFeedback(event.results[0][0].transcript);
recognition.onerror = () => stopMicUI();
recognition.onend = () => stopMicUI();
}

document.getElementById('audio-unlock-overlay').remove();
document.getElementById('app').classList.remove('opacity-20');
renderLanguageBank();
renderDialogueTable();
updateStepUI();
lucide.createIcons();
}

async function playRawPcm(base64, sampleRate) {
const binary = atob(base64);
const bytes = new Uint8Array(binary.length);
for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
const int16 = new Int16Array(bytes.buffer);
const float32 = new Float32Array(int16.length);
for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;
const buffer = audioCtx.createBuffer(1, float32.length, sampleRate);
buffer.getChannelData(0).set(float32);
const source = audioCtx.createBufferSource();
source.buffer = buffer;
source.connect(audioCtx.destination);
source.start();
return new Promise(resolve => source.onended = resolve);
}

async function speak(text, speaker, btnEl) {
if (isSpeaking) return;
isSpeaking = true;
const icon = btnEl?.querySelector('i');
if (btnEl) btnEl.classList.add('audio-loading');
if (icon) icon.classList.add('audio-playing');

try {
const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${apiKey}`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
contents: [{ parts: [{ text: `${speaker}: ${text}` }] }],
generationConfig: {
responseModalities: ["AUDIO"],
speechConfig: {
voiceConfig: {
multiSpeakerVoiceConfig: {
speakerVoiceConfigs: [
{ speaker: "Jack", voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } },
{ speaker: "Ms Parker", voiceConfig: { prebuiltVoiceConfig: { voiceName: "Leda" } } }
]
}
}
}
}
})
});
const result = await response.json();
const part = result.candidates?.[0]?.content?.parts?.[0]?.inlineData;
if (part) {
const sampleRate = parseInt(part.mimeType.match(/rate=(\d+)/)?.[1] || 24000);
await playRawPcm(part.data, sampleRate);
}
} catch (e) { console.error(e); } finally {
isSpeaking = false;
if (btnEl) btnEl.classList.remove('audio-loading');
if (icon) icon.classList.remove('audio-playing');
}
}

async function toggleMic() {
if (isRecording) { recognition.stop(); return; }
try {
await navigator.mediaDevices.getUserMedia({ audio: true });
isRecording = true;
document.getElementById('btn-mic').classList.add('mic-active');
recognition.start();
} catch (err) { showStatus("Microphone access is required."); }
}

function stopMicUI() {
isRecording = false;
document.getElementById('btn-mic').classList.remove('mic-active');
}

function displayFeedback(transcript) {
const target = CONVERSATION[currentStep].text.toLowerCase().replace(/[^\w\s]/g, "");
const input = transcript.toLowerCase().replace(/[^\w\s]/g, "");
const targetWords = target.split(/\s+/);
const inputWords = input.split(/\s+/);
const matches = targetWords.filter(w => inputWords.includes(w)).length;
const accuracy = Math.round((matches / targetWords.length) * 100);

document.getElementById('feedback-display').classList.remove('hidden');
document.getElementById('transcript-text').innerText = `"${transcript}"`;
document.getElementById('accuracy-text').innerText = `${accuracy}%`;
document.getElementById('accuracy-bar').style.width = `${accuracy}%`;
if (accuracy > 80) showStatus("Excellent!");
}

function renderLanguageBank() {
const container = document.getElementById('view-bank');
container.innerHTML = LANGUAGE_BANK_DATA.map(cat => `
<div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
<div class="bg-slate-50 p-5 border-b border-slate-100"><h3 class="font-black text-indigo-600 text-xs uppercase tracking-widest">${cat.category}</h3></div>
<div class="p-6 space-y-6">
${cat.subsections.map(sub => `
<div>
<h4 class="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest">${sub.title}</h4>
<div class="space-y-1">
${sub.items.map(item => `
<div class="flex items-center justify-between p-3 rounded-2xl hover:bg-slate-50 transition-colors">
<span class="text-sm font-medium text-slate-700">${item}</span>
<button onclick="speak('${item.replace(/'/g, "\\'")}', 'Jack', this)" class="p-2 text-slate-300 hover:text-indigo-600 transition-all"><i data-lucide="volume-2" class="w-4 h-4"></i></button>
</div>
`).join('')}
</div>
</div>
`).join('')}
</div>
</div>
`).join('');
}

function renderDialogueTable() {
const container = document.getElementById('practice-table');
container.innerHTML = CONVERSATION.map((line, i) => {
const isJack = line.speaker === 'Jack';
return `
<div class="practice-row flex w-full ${isJack ? 'justify-start' : 'justify-end'}" id="row-${i}">
<div class="max-w-[80%] flex flex-col ${isJack ? 'items-start' : 'items-end'}">
<span class="text-[9px] font-black uppercase tracking-[0.2em] mb-1 px-2 ${isJack ? 'text-indigo-500' : 'text-emerald-500'}">
${line.speaker}
</span>
<div class="p-4 rounded-[1.5rem] shadow-sm relative group ${isJack ? 'bg-indigo-50 rounded-tl-none border-l-4 border-indigo-500' : 'bg-emerald-50 rounded-tr-none border-r-4 border-emerald-500'}">
<p class="text-sm md:text-base font-bold text-slate-700 leading-relaxed">"${line.text}"</p>
<button onclick="speak('${line.text.replace(/'/g, "\\'")}', '${line.speaker}', this)" class="absolute -right-10 top-1/2 -translate-y-1/2 p-2 text-slate-300 hover:text-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity">
<i data-lucide="volume-2" class="w-4 h-4"></i>
</button>
</div>
</div>
</div>
`;
}).join('');
lucide.createIcons();
}

function updateStepUI() {
CONVERSATION.forEach((_, i) => {
const el = document.getElementById(`row-${i}`);
if (el) {
el.classList.toggle('row-active', i === currentStep);
el.classList.toggle('row-inactive', i !== currentStep);
if (i === currentStep) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
});
}

function playCurrentLine() {
speak(CONVERSATION[currentStep].text, CONVERSATION[currentStep].speaker, document.getElementById('btn-listen'));
}

function nextStep() {
if (currentStep < CONVERSATION.length - 1) {
currentStep++;
document.getElementById('feedback-display').classList.add('hidden');
updateStepUI();
} else { showStatus("Dialogue Complete!"); }
}

function resetPractice() {
currentStep = 0;
document.getElementById('feedback-display').classList.add('hidden');
updateStepUI();
}

function switchTab(tab) {
document.getElementById('view-bank').classList.toggle('hidden', tab !== 'bank');
document.getElementById('view-practice').classList.toggle('hidden', tab !== 'practice');
document.getElementById('tab-bank').className = `px-6 md:px-8 py-2.5 rounded-xl text-sm font-bold uppercase transition-all ${tab === 'bank' ? 'tab-active' : 'text-slate-400'}`;
document.getElementById('tab-practice').className = `px-6 md:px-8 py-2.5 rounded-xl text-sm font-bold uppercase transition-all ${tab === 'practice' ? 'tab-active' : 'text-slate-400'}`;
lucide.createIcons();
if (tab === 'practice') updateStepUI();
}
</script>
</body>
</html>
