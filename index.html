<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEP 103 Language Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
.fade-in { animation: fadeIn 0.3s ease-out forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.tab-active { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
.mic-active { background-color: #ef4444; animation: pulse 1.5s infinite; transform: scale(1.1); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
.audio-loading { opacity: 0.5; pointer-events: none; cursor: wait; }
.audio-playing { color: #4f46e5 !important; animation: bounce 0.5s infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-3px); } }

.line-active {
border-color: #6366f1 !important;
background-color: #f5f7ff !important;
transform: scale(1.02);
opacity: 1 !important;
box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
}
.line-inactive { opacity: 0.25; filter: grayscale(50%); }
.dialogue-scroll { max-height: 400px; overflow-y: auto; scroll-behavior: smooth; padding-bottom: 2rem; }
.dialogue-scroll::-webkit-scrollbar { width: 4px; }
.dialogue-scroll::-webkit-scrollbar-track { background: transparent; }
.dialogue-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

.bubble {
position: relative;
max-width: 95%;
padding: 1rem;
border-radius: 1.25rem;
border: 1px solid #e2e8f0;
background: white;
transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.bubble-left { border-bottom-left-radius: 2px; }
.bubble-right { border-bottom-right-radius: 2px; align-self: flex-end; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 overflow-x-hidden">
<div id="app" class="max-w-5xl mx-auto p-4 md:p-8">
<header class="flex flex-col md:flex-row justify-between items-center py-6 mb-8 gap-6 border-b border-slate-200/60">
<div class="flex items-center gap-4">
<div class="p-3 bg-indigo-600 rounded-2xl text-white shadow-xl shadow-indigo-100">
<i data-lucide="languages" class="w-8 h-8"></i>
</div>
<div>
<h1 class="text-4xl font-black italic tracking-tighter leading-none text-slate-800">VEP 103</h1>
<p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1.5">Vocational English Portal</p>
</div>
</div>
<div class="flex bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200">
<button type="button" onclick="switchTab('bank')" id="tab-bank" class="px-6 md:px-8 py-2.5 rounded-xl text-sm font-bold transition-all tab-active uppercase">Language Bank</button>
<button type="button" onclick="switchTab('practice')" id="tab-practice" class="px-6 md:px-8 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-slate-600 uppercase">Practice</button>
</div>
</header>

<main id="view-bank" class="grid md:grid-cols-2 gap-6 pb-20 fade-in">
<!-- Content injected via JS -->
</main>

<main id="view-practice" class="hidden max-w-4xl mx-auto pb-20 fade-in">
<div class="bg-white rounded-[2.5rem] p-6 md:p-10 shadow-2xl shadow-slate-200/50 border border-white relative flex flex-col gap-6">

<div class="flex justify-between items-center">
<div class="flex flex-col gap-1">
<span id="step-indicator" class="bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-full text-[10px] font-black tracking-widest uppercase inline-block w-fit">STEP 1 / 11</span>
<div id="mic-status-badge" class="flex items-center gap-2 px-2 py-1">
<div id="mic-dot" class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>
<span id="mic-status-text" class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">Mic: Not Initialized</span>
</div>
</div>
<button type="button" onclick="resetPractice()" class="text-[9px] font-black text-slate-300 hover:text-indigo-500 uppercase tracking-widest transition-colors">Reset Session</button>
</div>

<div class="grid grid-cols-2 gap-4 border-b border-slate-100 pb-4">
<div class="text-center"><span class="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-600">Attendant</span></div>
<div class="text-center border-l border-slate-100"><span class="text-[10px] font-black uppercase tracking-[0.2em] text-pink-600">Ms Parker</span></div>
</div>

<div class="bg-slate-50/50 p-6 rounded-[2rem] border border-slate-100/50">
<div class="flex justify-center items-center gap-10 md:gap-16">
<button type="button" id="play-btn" onclick="playCurrentLine()" class="w-14 h-14 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-400 hover:bg-indigo-50 hover:text-indigo-600 transition-all active:scale-90 border border-slate-100">
<i data-lucide="volume-2" id="play-icon" class="w-7 h-7"></i>
</button>

<div class="relative">
<button type="button" onclick="toggleMic()" id="mic-btn" class="w-24 h-24 rounded-full bg-indigo-600 flex items-center justify-center text-white shadow-xl transition-all active:scale-95 z-10">
<i data-lucide="mic" id="mic-icon" class="w-10 h-10"></i>
</button>
</div>

<button type="button" onclick="nextStep()" class="w-14 h-14 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-400 hover:bg-indigo-50 hover:text-indigo-600 transition-all active:scale-90 border border-slate-100">
<i data-lucide="chevron-right" class="w-7 h-7"></i>
</button>
</div>

<div id="feedback-area" class="hidden mt-6 bg-white p-5 rounded-2xl border border-indigo-50 fade-in shadow-sm">
<div class="flex justify-between items-center mb-3">
<div class="flex-1">
<p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Detected Speech</p>
<p id="transcript-display" class="text-base italic text-slate-700 font-medium leading-tight">"..."</p>
</div>
<div class="text-right ml-4">
<p class="text-[8px] font-black text-indigo-400 uppercase tracking-widest mb-1">Match</p>
<span id="score-text" class="text-xl font-black text-indigo-600">0%</span>
</div>
</div>
<div class="w-full h-1.5 bg-slate-50 rounded-full overflow-hidden shadow-inner">
<div id="score-bar" class="h-full bg-gradient-to-r from-indigo-400 to-indigo-600 transition-all duration-700" style="width: 0%"></div>
</div>
</div>
</div>

<div id="dialogue-container" class="dialogue-scroll pr-4 space-y-6 pt-2"></div>
</div>
</main>

<footer class="mt-20 py-12 border-t border-slate-200/60 text-center">
<p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.5em]">Unit 2: Hotel Services • Vocational Training</p>
</footer>
</div>

<script>
const apiKey = "";
const TTS_MODEL = "gemini-2.5-flash-preview-tts";

const LANGUAGE_BANK = [
{
category: "L1: Greeting Guests",
sections: [
{ title: "Welcoming", items: ["Welcome to [Lux Hotel].", "Welcome. This is [the lobby].", "Good morning.", "Hello.", "How are you?"] },
{ title: "Responding", items: ["Great, thanks. How about you?", "Great, too. Thank you.", "I'm fine too, thank you.", "I'm fine, thank you. And you?"] }
]
},
{
category: "L2: Saying Goodbye",
sections: [
{ title: "Farewells", items: ["Goodbye!", "Enjoy yourself.", "Have a good flight!", "Have a nice day!", "Have fun.", "See you later!"] }
]
},
{
category: "L3: Introductions",
sections: [
{ title: "Self-Introduction", items: ["Good afternoon. I'm [Jack]. How may I help you?", "I'm [Steve], [Steve Brown].", "My name's [Steve Brown].", "This is [Steve Brown]. He can help you with [this]."] }
]
},
{
category: "L4: Thanking & Responding",
sections: [
{ title: "Thanking", items: ["Thank you (very much).", "Thanks."] },
{ title: "Respond", items: ["(It's) My pleasure.", "I'm happy to help.", "No problem.", "Not at all.", "You're welcome."] }
]
}
];

const CONVERSATION = [
{ speaker: "Jack", role: "Attendant", text: "Good afternoon. I'm Jack. How may I help you?" },
{ speaker: "Ms Parker", role: "Ms Parker", text: "Good afternoon. I'd like a luggage parking ticket please." },
{ speaker: "Jack", role: "Attendant", text: "Of course. May I have your guest pass?" },
{ speaker: "Ms Parker", role: "Ms Parker", text: "Yes." },
{ speaker: "Jack", role: "Attendant", text: "Thank you Ms. Parker. Here's your ticket." },
{ speaker: "Ms Parker", role: "Ms Parker", text: "Thank you." },
{ speaker: "Jack", role: "Attendant", text: "You're welcome. By the way, it's raining outside. Do you have an umbrella?" },
{ speaker: "Ms Parker", role: "Ms Parker", text: "Oh no. I don't!" },
{ speaker: "Jack", role: "Attendant", text: "Don't worry. Here you are." },
{ speaker: "Ms Parker", role: "Ms Parker", text: "Oh thank you SO much!" },
{ speaker: "Jack", role: "Attendant", text: "Don't mention it." }
];

let currentStep = 0;
let activeTab = 'bank';
let isRecording = false;
let recognition = null;
let isSpeaking = false;
let speechInitiated = false;

window.onload = () => {
currentStep = parseInt(localStorage.getItem('vep_step')) || 0;
activeTab = localStorage.getItem('vep_tab') || 'bank';

renderBank();
renderDialogue();
switchTab(activeTab);
setupSpeechRecognition();
lucide.createIcons();
};

function renderBank() {
const container = document.getElementById('view-bank');
container.innerHTML = LANGUAGE_BANK.map((cat) => `
<div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl hover:shadow-slate-200/40 transition-all duration-300">
<div class="bg-slate-50/80 p-5 border-b border-slate-100 flex items-center justify-between">
<h3 class="font-black text-indigo-600 uppercase text-[10px] tracking-widest">${cat.category}</h3>
<i data-lucide="book-open" class="w-3 h-3 text-slate-300"></i>
</div>
<div class="p-6 space-y-8">
${cat.sections.map(sub => `
<div>
<h4 class="text-[10px] font-black text-slate-300 mb-4 uppercase italic tracking-widest">${sub.title}</h4>
<div class="space-y-1">
${sub.items.map(item => `
<div class="flex items-center justify-between p-3 rounded-xl hover:bg-indigo-50/50 group transition-colors cursor-default">
<span class="text-sm font-semibold text-slate-700">${item}</span>
<button type="button" onclick="speak('${item.replace(/'/g, "\\'")}', 'Jack', this)" class="p-2 text-slate-300 hover:text-indigo-600 transition-transform active:scale-90 speak-trigger">
<i data-lucide="volume-2" class="w-5 h-5"></i>
</button>
</div>
`).join('')}
</div>
</div>
`).join('')}
</div>
</div>
`).join('');
}

function renderDialogue() {
const container = document.getElementById('dialogue-container');
container.innerHTML = CONVERSATION.map((line, i) => `
<div id="row-${i}" class="grid grid-cols-2 gap-4">
<div class="flex flex-col">${line.speaker === 'Jack' ? `<div id="line-${i}" class="bubble bubble-left shadow-sm"><p class="text-sm font-semibold text-slate-700 italic">"${line.text}"</p></div>` : ''}</div>
<div class="flex flex-col">${line.speaker !== 'Jack' ? `<div id="line-${i}" class="bubble bubble-right border-pink-100 shadow-sm"><p class="text-sm font-semibold text-slate-700 italic">"${line.text}"</p></div>` : ''}</div>
</div>
`).join('');
}

function setupSpeechRecognition() {
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) return;

recognition = new SpeechRecognition();
recognition.lang = 'en-US';
recognition.continuous = false;
recognition.interimResults = false;

recognition.onstart = () => {
isRecording = true;
updateMicUI();
setMicStatus('Active', 'emerald');
};

recognition.onresult = (e) => {
const result = e.results[0][0].transcript;
showFeedback(result);
};

recognition.onerror = (e) => {
isRecording = false;
updateMicUI();
setMicStatus('Error', 'red');
};

recognition.onend = () => {
isRecording = false;
updateMicUI();
setMicStatus('Ready', 'emerald');
};
}

function setMicStatus(text, color) {
const dot = document.getElementById('mic-dot');
const txt = document.getElementById('mic-status-text');
if (dot && txt) {
dot.className = `w-1.5 h-1.5 rounded-full bg-${color}-500`;
txt.innerText = `Mic: ${text}`;
txt.className = `text-[9px] font-bold text-${color}-600 uppercase tracking-tighter`;
}
}

async function toggleMic() {
if (!recognition) return;
if (isRecording) {
recognition.stop();
return;
}
try {
if (!speechInitiated) {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
stream.getTracks().forEach(t => t.stop());
speechInitiated = true;
}
document.getElementById('feedback-area').classList.add('hidden');
recognition.start();
} catch (e) {
setMicStatus('Permission Denied', 'red');
}
}

function updateMicUI() {
const btn = document.getElementById('mic-btn');
if (btn) btn.className = `w-24 h-24 rounded-full flex items-center justify-center text-white shadow-2xl transition-all ${isRecording ? 'mic-active' : 'bg-indigo-600 hover:bg-indigo-700'}`;
}

function switchTab(tab) {
activeTab = tab;
localStorage.setItem('vep_tab', tab);
document.getElementById('view-bank').classList.toggle('hidden', tab !== 'bank');
document.getElementById('view-practice').classList.toggle('hidden', tab !== 'practice');
document.getElementById('tab-bank').className = `px-6 md:px-8 py-2.5 rounded-xl text-sm font-bold transition-all uppercase ${tab === 'bank' ? 'tab-active' : 'text-slate-400'}`;
document.getElementById('tab-practice').className = `px-6 md:px-8 py-2.5 rounded-xl text-sm font-bold transition-all uppercase ${tab === 'practice' ? 'tab-active' : 'text-slate-400'}`;
if (tab === 'practice') {
updateStepUI();
setMicStatus('Ready', 'emerald');
}
}

function nextStep() {
if (currentStep < CONVERSATION.length - 1) {
currentStep++;
localStorage.setItem('vep_step', currentStep);
updateStepUI();
}
}

function resetPractice() {
currentStep = 0;
localStorage.setItem('vep_step', 0);
updateStepUI();
}

function updateStepUI() {
document.getElementById('step-indicator').innerText = `STEP ${currentStep + 1} / ${CONVERSATION.length}`;
document.getElementById('feedback-area').classList.add('hidden');
CONVERSATION.forEach((_, i) => {
const el = document.getElementById(`line-${i}`);
if (el) {
if (i === currentStep) {
el.classList.add('line-active');
el.classList.remove('line-inactive');
const row = document.getElementById(`row-${i}`);
if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
} else {
el.classList.remove('line-active');
el.classList.add('line-inactive');
}
}
});
}

async function speak(text, speaker, btnEl = null) {
if (isSpeaking) return;
isSpeaking = true;

// UI Feedback: Loading
if (btnEl) {
btnEl.classList.add('audio-loading');
const icon = btnEl.querySelector('i');
if (icon) icon.classList.add('audio-playing');
}

const makeRequest = async (retryCount = 0) => {
try {
const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${apiKey}`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
contents: [{ parts: [{ text: `${speaker}: ${text}` }] }],
generationConfig: {
responseModalities: ["AUDIO"],
speechConfig: {
voiceConfig: {
multiSpeakerVoiceConfig: {
speakerVoiceConfigs: [
{ speaker: "Jack", voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } },
{ speaker: "Ms Parker", voiceConfig: { prebuiltVoiceConfig: { voiceName: "Leda" } } }
]
}
}
}
}
})
});

if (!response.ok) throw new Error(`HTTP ${response.status}`);
const result = await response.json();
const audioPart = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

if (!audioPart) throw new Error("No audio data in response");

const pcm = audioPart.inlineData.data;
const mimeType = audioPart.inlineData.mimeType;
const sampleRate = parseInt(mimeType.match(/rate=(\d+)/)?.[1] || 24000);

await playPcm(pcm, sampleRate, btnEl);
} catch (e) {
if (retryCount < 5) {
const delay = Math.pow(2, retryCount) * 1000;
setTimeout(() => makeRequest(retryCount + 1), delay);
} else {
console.error("TTS final failure", e);
cleanupAudioUI(btnEl);
}
}
};

makeRequest();
}

function cleanupAudioUI(btnEl) {
isSpeaking = false;
if (btnEl) {
btnEl.classList.remove('audio-loading');
const icon = btnEl.querySelector('i');
if (icon) icon.classList.remove('audio-playing');
}
}

async function playPcm(base64, sampleRate, btnEl) {
try {
const binary = atob(base64);
const bytes = new Uint8Array(binary.length);
for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

// Construct WAV File
const wavHeader = createWavHeader(bytes.length, sampleRate);
const blob = new Blob([wavHeader, bytes], { type: 'audio/wav' });
const url = URL.createObjectURL(blob);
const audio = new Audio(url);

audio.onplay = () => {
// Visual confirmation that audio started
if (btnEl) btnEl.classList.remove('audio-loading');
};

audio.onended = () => {
cleanupAudioUI(btnEl);
URL.revokeObjectURL(url);
};

audio.onerror = (e) => {
console.error("Audio playback error", e);
cleanupAudioUI(btnEl);
URL.revokeObjectURL(url);
};

// Browsers require interaction. Since this is triggered by a click, it should work.
await audio.play();
} catch (err) {
console.error("PCM Processing error", err);
cleanupAudioUI(btnEl);
}
}

function createWavHeader(dataLength, sampleRate) {
const buffer = new ArrayBuffer(44);
const view = new DataView(buffer);

const writeString = (offset, string) => {
for (let i = 0; i < string.length; i++) {
view.setUint8(offset + i, string.charCodeAt(i));
}
};

writeString(0, 'RIFF');
view.setUint32(4, 36 + dataLength, true);
writeString(8, 'WAVE');
writeString(12, 'fmt ');
view.setUint32(16, 16, true);
view.setUint16(20, 1, true); // PCM - integer
view.setUint16(22, 1, true); // Mono
view.setUint32(24, sampleRate, true);
view.setUint32(28, sampleRate * 2, true); // Byte rate
view.setUint16(32, 2, true); // Block align
view.setUint16(34, 16, true); // Bits per sample
writeString(36, 'data');
view.setUint32(40, dataLength, true);

return buffer;
}

function playCurrentLine() {
const line = CONVERSATION[currentStep];
speak(line.text, line.speaker, document.getElementById('play-btn'));
}

function showFeedback(text) {
const target = CONVERSATION[currentStep].text.toLowerCase().replace(/[^\w\s]/g, "");
const input = text.toLowerCase().replace(/[^\w\s]/g, "");
const targetWords = target.split(/\s+/);
const matches = targetWords.filter(w => input.includes(w)).length;
const score = Math.min(100, Math.round((matches / targetWords.length) * 100));
document.getElementById('feedback-area').classList.remove('hidden');
document.getElementById('transcript-display').innerText = `"${text}"`;
document.getElementById('score-bar').style.width = score + "%";
document.getElementById('score-text').innerText = score + "%";
}
</script>
</body>
</html>
